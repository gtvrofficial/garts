<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Feed Admin</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
<header class="topbar">
  <div class="topbar-inner">
    <strong>Feed Admin</strong>
  </div>
</header>

<main class="page admin-page">

  <section id="editor-panel" class="panel">

    <div class="section-head">
      <div>
        <h1 id="editor-title">Create post</h1>
        <p class="muted">Manage feed posts.</p>
      </div>
    </div>

    <label>
      Post ID
      <input id="post-id" placeholder="Leave blank to generate">
    </label>

    <label>
      Profile ID
      <input id="profile-id" placeholder="e.g. 1234567">
    </label>

    <label>
      Display name
      <input id="display-name">
    </label>

    <label>
      Username
      <input id="username" placeholder="@username">
    </label>

    <label>
      Post text
      <textarea id="content" rows="7"></textarea>
    </label>

    <label>
      Image URL
      <input id="image-url" type="url" placeholder="https://...">
    </label>

    <label>
      Starting stars
      <input id="stars" type="number" min="0" value="0">
    </label>

    <div class="actions">
      <button id="save">Create post</button>
      <button id="clear" class="secondary">Clear</button>
    </div>

    <h2>Existing posts</h2>

    <div id="post-list"></div>

    <p id="editor-status" class="status"></p>

  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>
const { createClient } = window.supabase;

const supabase = createClient(
  FEED_CONFIG.SUPABASE_URL,
  FEED_CONFIG.SUPABASE_ANON_KEY
);

const saveBtn = document.querySelector("#save");
const editorStatus = document.querySelector("#editor-status");

const fields = {
  id: document.querySelector("#post-id"),
  profile: document.querySelector("#profile-id"),
  name: document.querySelector("#display-name"),
  username: document.querySelector("#username"),
  content: document.querySelector("#content"),
  image: document.querySelector("#image-url"),
  stars: document.querySelector("#stars")
};


function clearEditor() {

  Object.values(fields).forEach(field => {
    field.value = "";
  });

  fields.stars.value = "0";

  saveBtn.textContent = "Create post";

  document.querySelector("#editor-title").textContent = "Create post";
}


async function refreshPosts() {

  const { data, error } = await supabase
    .from("posts")
    .select(`
      id,
      profile_id,
      display_name,
      username,
      content,
      image_url,
      stars,
      created_at
    `)
    .order("created_at", { ascending: false });

  const list = document.querySelector("#post-list");

  list.replaceChildren();

  if (error) {

    editorStatus.textContent = error.message;

    return;
  }


  (data || []).forEach(post => {

    const row = document.createElement("div");

    row.className = "post-row";


    const info = document.createElement("div");

    const title = document.createElement("div");

    title.textContent =
      `${post.display_name || "Unknown"} — ${post.id}`;


    const small = document.createElement("div");

    small.className = "small";

    small.textContent =
      `${post.stars} stars • ${post.username || ""}`;


    info.append(title, small);


    const edit = document.createElement("button");

    edit.textContent = "Edit";


    edit.onclick = () => {

      fields.id.value = post.id;

      fields.profile.value =
        post.profile_id || "";

      fields.name.value =
        post.display_name || "";

      fields.username.value =
        post.username || "";

      fields.content.value =
        post.content || "";

      fields.image.value =
        post.image_url || "";

      fields.stars.value =
        post.stars ?? 0;


      saveBtn.textContent =
        "Save changes";

      document.querySelector(
        "#editor-title"
      ).textContent = "Edit post";


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    };


    row.append(info, edit);

    list.append(row);

  });

}


saveBtn.onclick = async () => {

  editorStatus.textContent =
    "Saving…";


  const payload = {

    profile_id:
      fields.profile.value.trim() || null,

    display_name:
      fields.name.value.trim(),

    username:
      fields.username.value
        .trim()
        .replace(/^@/, ""),

    content:
      fields.content.value,

    image_url:
      fields.image.value.trim() || null,

    stars:
      Math.max(
        0,
        Number(fields.stars.value) || 0
      )

  };


  let result;


  if (fields.id.value.trim()) {

    result = await supabase
      .from("posts")
      .update(payload)
      .eq("id", fields.id.value.trim());

  } else {

    result = await supabase
      .from("posts")
      .insert(payload);

  }


  if (result.error) {

    editorStatus.textContent =
      result.error.message;

    return;

  }


  editorStatus.textContent =
    "Saved successfully.";

  clearEditor();

  await refreshPosts();

};


document.querySelector("#clear")
  .onclick = clearEditor;


// Load posts immediately.
refreshPosts();

</script>

</body>
</html>
