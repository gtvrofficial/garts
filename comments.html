<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GARTS Comments</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background: #f5f5f5;
    color: #111;
}

body {
    padding: 14px;
}

.comments {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
}

/* =========================================================
   HEADER
========================================================= */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 14px;
}

.title {
    font-size: 20px;
    font-weight: 700;
}

.count {
    font-size: 13px;
    color: #777;
}

/* =========================================================
   COMMENT BOX
========================================================= */

.composer {
    background: #fff;
    border-radius: 12px;

    padding: 12px;

    margin-bottom: 16px;

    border: 1px solid #e5e5e5;
}

textarea {
    width: 100%;
    min-height: 80px;

    resize: vertical;

    border: 1px solid #ddd;
    border-radius: 9px;

    padding: 10px 11px;

    font-family: inherit;
    font-size: 14px;

    outline: none;

    background: #fafafa;
    color: #111;
}

textarea:focus {
    border-color: #999;
    background: #fff;
}

.composer-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-top: 9px;
}

.login-message {
    font-size: 13px;
    color: #777;
}

.button {
    border: 0;
    border-radius: 8px;

    padding: 9px 14px;

    background: #111;
    color: #fff;

    font-size: 13px;
    font-weight: 600;

    cursor: pointer;
}

.button:hover {
    opacity: .9;
}

.button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

/* =========================================================
   COMMENTS
========================================================= */

.comment {
    background: #fff;

    border: 1px solid #e5e5e5;
    border-radius: 12px;

    padding: 13px;

    margin-bottom: 10px;
}

.comment-header {
    display: flex;
    align-items: center;
    gap: 9px;
}

.avatar {
    width: 38px;
    height: 38px;

    border-radius: 50%;

    object-fit: cover;

    background: #eee;
}

.comment-user {
    min-width: 0;
}

.name {
    font-size: 14px;
    font-weight: 700;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.time {
    font-size: 12px;
    color: #888;

    margin-top: 1px;
}

.comment-body {
    margin-top: 9px;

    font-size: 14px;
    line-height: 1.45;

    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.comment-actions {
    margin-top: 9px;

    display: flex;
    gap: 12px;
}

.action {
    border: 0;
    background: transparent;

    padding: 0;

    color: #777;

    font-size: 12px;
    font-weight: 600;

    cursor: pointer;
}

.action:hover {
    color: #111;
}

/* =========================================================
   REPLIES
========================================================= */

.replies {
    margin-top: 10px;
    margin-left: 45px;

    padding-left: 10px;

    border-left: 2px solid #eee;
}

.reply {
    margin-bottom: 9px;
}

/* =========================================================
   STATES
========================================================= */

.loading,
.empty,
.error {
    text-align: center;

    padding: 30px 15px;

    font-size: 14px;
}

.loading,
.empty {
    color: #777;
}

.error {
    color: #c62828;
}

/* =========================================================
   LOGIN
========================================================= */

.sign-in {
    display: none;
}

.sign-in.visible {
    display: block;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 520px) {

    body {
        padding: 9px;
    }

    .title {
        font-size: 18px;
    }

    .composer {
        padding: 10px;
    }

    .comment {
        padding: 11px;
    }

    .replies {
        margin-left: 25px;
    }
}
</style>
</head>

<body>

<div class="comments">

    <div class="header">

        <div class="title">
            Comments
        </div>

        <div
            id="count"
            class="count"
        >
            0
        </div>

    </div>


    <!-- =====================================================
         COMPOSER
    ====================================================== -->

    <div class="composer">

        <textarea
            id="commentInput"
            placeholder="Write a comment..."
            maxlength="5000"
        ></textarea>

        <div class="composer-bottom">

            <div
                id="loginMessage"
                class="login-message"
            >
                Sign in with GitHub to comment.
            </div>

            <button
                id="postButton"
                class="button"
                disabled
            >
                Post
            </button>

        </div>

    </div>


    <!-- =====================================================
         COMMENTS LIST
    ====================================================== -->

    <div id="commentsList">

        <div class="loading">
            Loading comments...
        </div>

    </div>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const WORKER =
    "https://garts-comments.w8361346.workers.dev";

const TOKEN_KEY =
    "garts_session_token";


/* =========================================================
   POST ID
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const postId =
    params.get("id");


/* =========================================================
   ELEMENTS
========================================================= */

const input =
    document.getElementById(
        "commentInput"
    );

const postButton =
    document.getElementById(
        "postButton"
    );

const loginMessage =
    document.getElementById(
        "loginMessage"
    );

const commentsList =
    document.getElementById(
        "commentsList"
    );

const count =
    document.getElementById(
        "count"
    );


/* =========================================================
   STATE
========================================================= */

let discussion = null;

let currentUser = null;

let replyToId = null;


/* =========================================================
   TOKEN
========================================================= */

function getToken() {

    return localStorage.getItem(
        TOKEN_KEY
    );
}


/* =========================================================
   API
========================================================= */

async function api(
    path,
    options = {}
) {

    const token =
        getToken();

    const headers = {
        ...(options.headers || {})
    };

    if (
        options.body &&
        !headers["Content-Type"]
    ) {
        headers["Content-Type"] =
            "application/json";
    }

    if (token) {

        headers.Authorization =
            `Bearer ${token}`;
    }

    const response =
        await fetch(
            WORKER + path,
            {
                ...options,
                headers,
                cache: "no-store"
            }
        );

    let data = null;

    try {
        data =
            await response.json();
    } catch {
        data = {};
    }

    if (!response.ok) {

        throw new Error(
            data.error ||
            `HTTP ${response.status}`
        );
    }

    return data;
}


/* =========================================================
   AUTH STATE
========================================================= */

async function checkLogin() {

    const token =
        getToken();

    if (!token) {

        currentUser = null;

        updateComposer();

        return;
    }

    try {

        const data =
            await api(
                "/api/me"
            );

        if (
            data.loggedIn &&
            data.user
        ) {

            currentUser =
                data.user;

        } else {

            currentUser = null;

            /*
             * The token is invalid/expired.
             */
            localStorage.removeItem(
                TOKEN_KEY
            );
        }

    } catch (error) {

        console.error(
            "Authentication check failed:",
            error
        );

        currentUser = null;
    }

    updateComposer();
}


/* =========================================================
   COMPOSER UI
========================================================= */

function updateComposer() {

    if (currentUser) {

        loginMessage.textContent =
            `Commenting as @${currentUser.login}`;

        postButton.disabled = false;

        input.disabled = false;

    } else {

        loginMessage.textContent =
            "Sign in with GitHub to comment.";

        postButton.disabled = true;

        input.disabled = true;
    }
}


/* =========================================================
   LOAD DISCUSSION
========================================================= */

async function loadComments() {

    if (!postId) {

        commentsList.innerHTML = `
            <div class="error">
                No post ID was provided.
            </div>
        `;

        return;
    }

    try {

        const data =
            await api(
                `/?id=${encodeURIComponent(
                    postId
                )}`
            );

        if (
            !data.success ||
            !data.discussion
        ) {

            throw new Error(
                data.error ||
                "Could not load comments."
            );
        }

        discussion =
            data.discussion;

        renderComments();

    } catch (error) {

        console.error(
            "Could not load comments:",
            error
        );

        commentsList.innerHTML = `
            <div class="error">
                ${escapeHtml(
                    error.message ||
                    "Could not load comments."
                )}
            </div>
        `;
    }
}


/* =========================================================
   RENDER COMMENTS
========================================================= */

function renderComments() {

    const comments =
        discussion?.comments?.nodes || [];

    count.textContent =
        comments.length;

    if (!comments.length) {

        commentsList.innerHTML = `
            <div class="empty">
                No comments yet. Be the first!
            </div>
        `;

        return;
    }

    commentsList.innerHTML =
        comments
            .map(comment =>
                renderComment(
                    comment,
                    false
                )
            )
            .join("");
}


/* =========================================================
   RENDER COMMENT
========================================================= */

function renderComment(
    comment,
    isReply
) {

    const author =
        comment.author;

    const name =
        author?.login ||
        "Unknown user";

    const avatar =
        author?.avatarUrl ||
        "";

    const replies =
        comment.replies?.nodes || [];

    return `
        <div
            class="${isReply ? "reply" : "comment"}"
            data-comment-id="${escapeAttribute(
                comment.id
            )}"
        >

            <div class="comment-header">

                ${
                    avatar
                        ? `
                        <img
                            class="avatar"
                            src="${escapeAttribute(
                                avatar
                            )}"
                            alt=""
                        >
                        `
                        : `
                        <div
                            class="avatar"
                        ></div>
                        `
                }

                <div class="comment-user">

                    <div class="name">
                        ${escapeHtml(name)}
                    </div>

                    <div class="time">
                        ${formatDate(
                            comment.createdAt
                        )}
                    </div>

                </div>

            </div>

            <div class="comment-body">
                ${escapeHtml(
                    comment.body || ""
                )}
            </div>

            ${
                !isReply
                    ? `
                    <div class="comment-actions">

                        <button
                            class="action"
                            onclick="startReply(
                                '${escapeAttribute(
                                    comment.id
                                )}'
                            )"
                        >
                            Reply
                        </button>

                    </div>
                    `
                    : ""
            }

            ${
                replies.length
                    ? `
                    <div class="replies">

                        ${replies
                            .map(reply =>
                                renderComment(
                                    reply,
                                    true
                                )
                            )
                            .join("")
                        }

                    </div>
                    `
                    : ""
            }

        </div>
    `;
}


/* =========================================================
   REPLY
========================================================= */

function startReply(commentId) {

    replyToId =
        commentId;

    input.placeholder =
        "Write a reply...";

    input.focus();

    postButton.textContent =
        "Reply";
}


/* =========================================================
   CANCEL REPLY
========================================================= */

function cancelReply() {

    replyToId = null;

    input.placeholder =
        "Write a comment...";

    postButton.textContent =
        "Post";
}


/* =========================================================
   POST COMMENT
========================================================= */

postButton.addEventListener(
    "click",
    async () => {

        if (!currentUser) {

            alert(
                "Please sign in with GitHub first."
            );

            return;
        }

        const body =
            input.value.trim();

        if (!body) {
            return;
        }

        postButton.disabled =
            true;

        postButton.textContent =
            replyToId
                ? "Replying..."
                : "Posting...";

        try {

            const data =
                await api(
                    `/api/comment?id=${encodeURIComponent(
                        postId
                    )}`,
                    {
                        method: "POST",

                        body: JSON.stringify({
                            body,
                            replyToId
                        })
                    }
                );

            if (!data.success) {

                throw new Error(
                    data.error ||
                    "Could not post comment."
                );
            }

            /*
             * Reset composer.
             */

            input.value = "";

            cancelReply();

            /*
             * Reload comments so the new
             * comment appears immediately.
             */

            await loadComments();

        } catch (error) {

            console.error(
                "Comment failed:",
                error
            );

            alert(
                error.message ||
                "Could not post comment."
            );

        } finally {

            updateComposer();
        }
    }
);


/* =========================================================
   ENTER / CTRL+ENTER
========================================================= */

input.addEventListener(
    "keydown",
    event => {

        /*
         * Ctrl+Enter or Cmd+Enter posts.
         */

        if (
            event.key === "Enter" &&
            (event.ctrlKey || event.metaKey)
        ) {

            event.preventDefault();

            if (
                currentUser &&
                input.value.trim()
            ) {

                postButton.click();
            }
        }

        /*
         * Escape cancels a reply.
         */

        if (
            event.key === "Escape" &&
            replyToId
        ) {

            cancelReply();
        }
    }
);


/* =========================================================
   OAUTH MESSAGE
========================================================= */

window.addEventListener(
    "message",
    async event => {

        /*
         * Only accept messages from our Worker.
         */

        if (
            event.origin !== WORKER
        ) {
            return;
        }

        const data =
            event.data;

        if (
            !data ||
            data.type !== "garts-auth"
        ) {
            return;
        }

        if (!data.token) {
            return;
        }

        /*
         * Save the same session token used
         * by welcome.html.
         */

        localStorage.setItem(
            TOKEN_KEY,
            data.token
        );

        /*
         * Verify the session.
         */

        await checkLogin();

    }
);


/* =========================================================
   UTILITIES
========================================================= */

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function escapeAttribute(value) {

    return escapeHtml(value);
}

function formatDate(date) {

    if (!date) {
        return "";
    }

    const parsed =
        new Date(date);

    if (
        Number.isNaN(
            parsed.getTime()
        )
    ) {
        return "";
    }

    return parsed.toLocaleString(
        undefined,
        {
            dateStyle: "medium",
            timeStyle: "short"
        }
    );
}


/* =========================================================
   START
========================================================= */

async function start() {

    await checkLogin();

    await loadComments();
}

start();

</script>

</body>
</html>
```
