<body>

<div class="comments-container">
    <div class="card">

        <div class="header">
            <div class="title">Comments</div>

            <button
                id="loginButton"
                class="login-button"
                onclick="login()">
                Sign in with GitHub
            </button>

            <div id="userArea" class="user-area">
                <img id="avatar" class="avatar" src="" alt="">
                <span id="username"></span>
            </div>
        </div>

        <div id="loginMessage" class="login-message">
            Sign in with GitHub to leave a comment.
        </div>

        <div id="commentBox" class="comment-box" style="display:none;">
            <textarea
                id="commentInput"
                placeholder="Write a comment..."
                maxlength="2000"></textarea>

            <button
                id="postButton"
                class="post-button"
                onclick="postComment()">
                Post
            </button>
        </div>

        <div id="status" class="status"></div>

        <div id="comments">
            <div class="empty">Loading comments...</div>
        </div>

    </div>
</div>

<script>
const WORKER = "https://garts-comments.w8361346.workers.dev";
const TOKEN_KEY = "garts_session_token";

const params = new URLSearchParams(window.location.search);
const postId = params.get("id");

let sessionToken = null;
let currentUser = null;
let popup = null;


/* -----------------------------
   STORAGE
----------------------------- */

function getToken() {
    try {
        return localStorage.getItem(TOKEN_KEY);
    } catch {
        return null;
    }
}

function saveToken(token) {
    try {
        localStorage.setItem(TOKEN_KEY, token);
    } catch {}

    sessionToken = token;
}


/* -----------------------------
   API
----------------------------- */

async function api(path, options = {}) {

    const headers = {
        "Content-Type": "application/json",
        ...(options.headers || {})
    };

    if (sessionToken) {
        headers["Authorization"] = "Bearer " + sessionToken;
    }

    const response = await fetch(WORKER + path, {
        ...options,
        headers
    });

    let data;

    try {
        data = await response.json();
    } catch {
        throw new Error("Invalid server response.");
    }

    if (!response.ok) {
        throw new Error(data.error || "Request failed.");
    }

    return data;
}


/* -----------------------------
   LOGIN
----------------------------- */

function login() {

    const width = 500;
    const height = 700;

    const left =
        window.screenX +
        Math.max(0, (window.outerWidth - width) / 2);

    const top =
        window.screenY +
        Math.max(0, (window.outerHeight - height) / 2);

    popup = window.open(
        WORKER + "/auth/github?postId=" +
        encodeURIComponent(postId || ""),
        "gartsGitHubLogin",
        `width=${width},height=${height},left=${left},top=${top}`
    );

    if (!popup) {
        setStatus("Please allow popups for this site.");
    }
}


/* -----------------------------
   AUTH MESSAGE
----------------------------- */

window.addEventListener("message", async (event) => {

    if (event.origin !== WORKER) {
        return;
    }

    const data = event.data;

    if (!data || data.type !== "garts-auth") {
        return;
    }

    if (!data.token) {
        setStatus("Login failed.");
        return;
    }

    saveToken(data.token);

    currentUser =
        data.user ||
        data.profile ||
        null;

    await loadUser();

    if (popup && !popup.closed) {
        popup.close();
    }
});


/* -----------------------------
   CHECK LOGIN
----------------------------- */

async function loadUser() {

    if (!sessionToken) {
        showLoggedOut();
        return;
    }

    try {

        const data = await api("/api/me");

        if (!data.loggedIn) {
            clearLogin();
            return;
        }

        currentUser = data.user;

        showLoggedIn();

    } catch (error) {

        console.error("Authentication check failed:", error);

        clearLogin();
    }
}


/* -----------------------------
   LOGIN UI
----------------------------- */

function showLoggedIn() {

    document.getElementById("loginButton").style.display = "none";
    document.getElementById("userArea").style.display = "flex";
    document.getElementById("commentBox").style.display = "flex";
    document.getElementById("loginMessage").style.display = "none";

    const username =
        currentUser?.login ||
        currentUser?.username ||
        currentUser?.displayName ||
        "GitHub user";

    document.getElementById("username").textContent =
        username;

    if (currentUser?.avatar_url) {
        document.getElementById("avatar").src =
            currentUser.avatar_url;
    }
}


function showLoggedOut() {

    document.getElementById("loginButton").style.display = "block";
    document.getElementById("userArea").style.display = "none";
    document.getElementById("commentBox").style.display = "none";
    document.getElementById("loginMessage").style.display = "block";
}


function clearLogin() {

    sessionToken = null;
    currentUser = null;

    try {
        localStorage.removeItem(TOKEN_KEY);
    } catch {}

    showLoggedOut();
}


/* -----------------------------
   COMMENTS
----------------------------- */

async function loadComments() {

    if (!postId) {
        document.getElementById("comments").innerHTML =
            '<div class="empty">No post ID provided.</div>';
        return;
    }

    try {

        const data = await api(
            "/?id=" + encodeURIComponent(postId)
        );

        renderComments(
            data.discussion?.comments?.nodes || []
        );

    } catch (error) {

        console.error(error);

        document.getElementById("comments").innerHTML =
            '<div class="empty">Unable to load comments.</div>';
    }
}


/* -----------------------------
   RENDER COMMENTS
----------------------------- */

function renderComments(comments) {

    const container =
        document.getElementById("comments");

    if (!comments.length) {

        container.innerHTML =
            '<div class="empty">No comments yet. Be the first!</div>';

        return;
    }

    container.innerHTML = "";

    const topLevel = comments.filter(
        comment => !comment.replyTo
    );

    const replies = comments.filter(
        comment => comment.replyTo
    );

    topLevel.forEach(comment => {

        container.appendChild(
            createComment(comment)
        );

        replies
            .filter(reply =>
                reply.replyTo?.id === comment.id
            )
            .forEach(reply => {

                const replyElement =
                    createComment(reply, true);

                container.appendChild(replyElement);
            });
    });
}


/* -----------------------------
   COMMENT ELEMENT
----------------------------- */

function createComment(comment, isReply = false) {

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "comment" + (isReply ? " reply" : "");

    const content =
        document.createElement("div");

    content.className =
        isReply
            ? "reply-line"
            : "";

    const bubble =
        document.createElement("div");

    bubble.className =
        "comment-content";

    const author =
        document.createElement("div");

    author.className =
        "comment-author";

    author.textContent =
        comment.author?.login ||
        comment.author?.name ||
        "GitHub user";

    const text =
        document.createElement("div");

    text.className =
        "comment-text";

    text.textContent =
        comment.body || "";

    bubble.appendChild(author);
    bubble.appendChild(text);

    const date =
        document.createElement("div");

    date.className =
        "comment-date";

    date.textContent =
        formatDate(comment.createdAt);

    content.appendChild(bubble);
    content.appendChild(date);

    wrapper.appendChild(content);

    return wrapper;
}


/* -----------------------------
   POST COMMENT
----------------------------- */

async function postComment() {

    if (!sessionToken) {

        login();

        return;
    }

    const input =
        document.getElementById("commentInput");

    const button =
        document.getElementById("postButton");

    const body =
        input.value.trim();

    if (!body) {
        return;
    }

    button.disabled = true;
    setStatus("Posting...");

    try {

        await api(
            "/api/comment?id=" +
            encodeURIComponent(postId),
            {
                method: "POST",

                body: JSON.stringify({
                    body
                })
            }
        );

        input.value = "";

        setStatus("Comment posted.");

        await loadComments();

    } catch (error) {

        console.error(error);

        if (
            error.message
                .toLowerCase()
                .includes("auth")
        ) {
            clearLogin();

            setStatus(
                "Your login expired. Please sign in again."
            );

        } else {

            setStatus(
                error.message ||
                "Could not post comment."
            );
        }

    } finally {

        button.disabled = false;
    }
}


/* -----------------------------
   DATE
----------------------------- */

function formatDate(date) {

    if (!date) {
        return "";
    }

    const d = new Date(date);

    if (Number.isNaN(d.getTime())) {
        return "";
    }

    return d.toLocaleString();
}


/* -----------------------------
   STATUS
----------------------------- */

function setStatus(message) {

    document.getElementById("status").textContent =
        message;

    if (message) {

        setTimeout(() => {

            const status =
                document.getElementById("status");

            if (status.textContent === message) {
                status.textContent = "";
            }

        }, 4000);
    }
}


/* -----------------------------
   START
----------------------------- */

(async function init() {

    sessionToken = getToken();

    await loadUser();

    await loadComments();

})();
</script>

</body>
</html>
