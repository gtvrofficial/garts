<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comments</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
    }

    .comments {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 10px;
    }

    .title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    @media (max-width: 600px) {
      .comments {
        padding: 5px;
      }

      .title {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

<div class="comments">
  <div class="title">Comments</div>
  <div id="giscus"></div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const postId = params.get("id");

  if (!postId) {
    document.getElementById("giscus").innerHTML =
      "<p>This post does not have a comment ID.</p>";
  } else {

    const script = document.createElement("script");

    script.src = "https://giscus.app/client.js";

    script.setAttribute("data-repo", "gtvrofficial/garts");
    script.setAttribute("data-repo-id", "R_kgDOUK6Pgg");

    script.setAttribute("data-category", "General");
    script.setAttribute("data-category-id", "DIC_kwDOUK6Pgs4DEvEc");

    script.setAttribute("data-mapping", "specific");
    script.setAttribute("data-term", "post-" + postId);

    script.setAttribute("data-strict", "0");
    script.setAttribute("data-reactions-enabled", "1");
    script.setAttribute("data-emit-metadata", "0");
    script.setAttribute("data-input-position", "bottom");
    script.setAttribute("data-theme", "preferred_color_scheme");
    script.setAttribute("data-lang", "en");

    script.setAttribute("crossorigin", "anonymous");
    script.async = true;

    document.getElementById("giscus").appendChild(script);
  }
</script>

</body>
</html>
