<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Comments</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: transparent;
    color: #050505;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    width: 100%;
}

.comments-container {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    padding: 8px;
}

/* HEADER */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
}

.title {
    font-size: 20px;
    font-weight: 700;
}

.login-button {
    border: none;
    background: #1877f2;
    color: white;
    padding: 9px 15px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
}

.login-button:hover {
    background: #166fe5;
}

.user-area {
    display: none;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: #65676b;
}

.avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    object-fit: cover;
}

/* LOGIN MESSAGE */

.login-message {
    background: rgba(240, 242, 245, .8);
    border-radius: 14px;
    padding: 13px;
    margin-bottom: 15px;
    color: #65676b;
    font-size: 14px;
    text-align: center;
}

/* COMMENT BOX */

.comment-box {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
}

textarea {
    flex: 1;
    resize: none;
    min-height: 44px;
    max-height: 140px;

    border: 1px solid #ccd0d5;
    border-radius: 18px;

    padding: 11px 15px;

    font-size: 15px;
    font-family: inherit;

    outline: none;

    background: rgba(240, 242, 245, .9);
}

textarea:focus {
    border-color: #1877f2;
    background: rgba(255, 255, 255, .95);
}

.post-button {
    align-self: flex-end;

    border: none;
    background: #1877f2;
    color: white;

    padding: 10px 17px;
    border-radius: 12px;

    font-weight: 600;
    cursor: pointer;
}

.post-button:disabled {
    opacity: .5;
    cursor: default;
}

/* COMMENTS */

.comment {
    position: relative;
    margin-bottom: 12px;
}

.comment-inner {
    display: flex;
    align-items: flex-start;
    gap: 9px;
}

.comment-avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
}

.comment-main {
    min-width: 0;
    flex: 1;
}

.comment-card {
    position: relative;

    background: rgba(240, 242, 245, .9);

    border-radius: 16px;

    padding: 10px 42px 10px 13px;

    width: fit-content;
    max-width: 100%;
}

.comment-author {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 3px;
}

.comment-text {
    font-size: 15px;
    line-height: 1.35;

    white-space: pre-wrap;
    word-break: break-word;
}

.comment-date {
    font-size: 12px;
    color: #65676b;
    margin: 4px 0 0 4px;
}

/* THREE DOT MENU */

.comment-menu {
    position: absolute;
    top: 7px;
    right: 7px;
}

.menu-button {
    width: 28px;
    height: 28px;

    border: none;
    border-radius: 50%;

    background: transparent;

    color: #65676b;

    font-size: 18px;
    line-height: 1;

    cursor: pointer;
}

.menu-button:hover {
    background: rgba(0, 0, 0, .08);
}

.menu-dropdown {
    display: none;

    position: absolute;
    right: 0;
    top: 32px;

    min-width: 130px;

    background: white;

    border-radius: 10px;

    box-shadow:
        0 3px 12px rgba(0, 0, 0, .18);

    overflow: hidden;

    z-index: 50;
}

.menu-dropdown button {
    width: 100%;

    border: none;
    background: white;

    padding: 10px 13px;

    text-align: left;

    font-size: 14px;

    cursor: pointer;
}

.menu-dropdown button:hover {
    background: #f0f2f5;
}

.delete-button {
    color: #e41e3f;
}

/* REPLIES */

.reply {
    margin-left: 47px;
}

.reply .comment-card {
    border-radius: 14px;
}

/* EMPTY */

.empty {
    text-align: center;
    color: #65676b;
    padding: 20px 5px;
}

/* STATUS */

.status {
    font-size: 13px;
    color: #65676b;
    margin: 7px 0 10px;
    text-align: center;
}

/* MOBILE */

@media (max-width: 600px) {

    .comments-container {
        padding: 5px;
    }

    .title {
        font-size: 18px;
    }

    .login-button {
        font-size: 13px;
        padding: 8px 12px;
    }

    .comment-avatar {
        width: 34px;
        height: 34px;
    }

    .reply {
        margin-left: 38px;
    }

    .comment-card {
        border-radius: 15px;
    }

    .comment-box {
        align-items: flex-end;
    }

    textarea {
        min-width: 0;
    }
}
</style>
</head>

<body>

<div class="comments-container">

    <div class="header">

        <div class="title">
            Comments
        </div>

        <button
            id="loginButton"
            class="login-button"
            onclick="login()">
            Sign in with GitHub
        </button>

        <div
            id="userArea"
            class="user-area">

            <img
                id="avatar"
                class="avatar"
                src=""
                alt="">

            <span id="username"></span>

        </div>

    </div>


    <div
        id="loginMessage"
        class="login-message">

        Sign in with GitHub to leave a comment.

    </div>


    <div
        id="commentBox"
        class="comment-box"
        style="display:none;">

        <textarea
            id="commentInput"
            placeholder="Write a comment..."
            maxlength="2000"></textarea>

        <button
            id="postButton"
            class="post-button"
            onclick="postComment()">

            Post

        </button>

    </div>


    <div
        id="status"
        class="status"></div>


    <div id="comments">

        <div class="empty">
            Loading comments...
        </div>

    </div>

</div>


<script>

const WORKER =
    "https://garts-comments.w8361346.workers.dev";

const TOKEN_KEY =
    "garts_session_token";

const params =
    new URLSearchParams(window.location.search);

const postId =
    params.get("id");

let sessionToken = null;
let currentUser = null;
let popup = null;


/* -----------------------------
   STORAGE
----------------------------- */

function getToken() {

    try {
        return localStorage.getItem(TOKEN_KEY);
    } catch {
        return null;
    }
}


function saveToken(token) {

    try {
        localStorage.setItem(
            TOKEN_KEY,
            token
        );
    } catch {}

    sessionToken = token;
}


/* -----------------------------
   API
----------------------------- */

async function api(path, options = {}) {

    const headers = {
        "Content-Type": "application/json",
        ...(options.headers || {})
    };

    if (sessionToken) {
        headers["Authorization"] =
            "Bearer " + sessionToken;
    }

    const response =
        await fetch(
            WORKER + path,
            {
                ...options,
                headers
            }
        );

    let data;

    try {
        data = await response.json();
    } catch {
        throw new Error(
            "Invalid server response."
        );
    }

    if (!response.ok) {
        throw new Error(
            data.error ||
            "Request failed."
        );
    }

    return data;
}


/* -----------------------------
   LOGIN
----------------------------- */

function login() {

    const width = 500;
    const height = 700;

    const left =
        window.screenX +
        Math.max(
            0,
            (window.outerWidth - width) / 2
        );

    const top =
        window.screenY +
        Math.max(
            0,
            (window.outerHeight - height) / 2
        );

    popup =
        window.open(
            WORKER +
            "/auth/github?postId=" +
            encodeURIComponent(
                postId || ""
            ),

            "gartsGitHubLogin",

            `width=${width},height=${height},left=${left},top=${top}`
        );

    if (!popup) {
        setStatus(
            "Please allow popups for this site."
        );
    }
}


/* -----------------------------
   AUTH MESSAGE
----------------------------- */

window.addEventListener(
    "message",
    async event => {

        if (event.origin !== WORKER) {
            return;
        }

        const data = event.data;

        if (
            !data ||
            data.type !== "garts-auth"
        ) {
            return;
        }

        if (!data.token) {

            setStatus(
                "Login failed."
            );

            return;
        }

        saveToken(data.token);

        currentUser =
            data.user ||
            data.profile ||
            null;

        await loadUser();

        if (
            popup &&
            !popup.closed
        ) {
            popup.close();
        }

    }
);


/* -----------------------------
   CHECK LOGIN
----------------------------- */

async function loadUser() {

    if (!sessionToken) {

        showLoggedOut();

        return;
    }

    try {

        const data =
            await api("/api/me");

        if (!data.loggedIn) {

            clearLogin();

            return;
        }

        currentUser =
            data.user;

        showLoggedIn();

    } catch (error) {

        console.error(
            "Authentication check failed:",
            error
        );

        clearLogin();
    }
}


/* -----------------------------
   LOGIN UI
----------------------------- */

function showLoggedIn() {

    document
        .getElementById("loginButton")
        .style.display = "none";

    document
        .getElementById("userArea")
        .style.display = "flex";

    document
        .getElementById("commentBox")
        .style.display = "flex";

    document
        .getElementById("loginMessage")
        .style.display = "none";


    const username =
        currentUser?.login ||
        currentUser?.username ||
        currentUser?.displayName ||
        "GitHub user";


    document
        .getElementById("username")
        .textContent =
        username;


    if (currentUser?.avatar_url) {

        document
            .getElementById("avatar")
            .src =
            currentUser.avatar_url;
    }
}


function showLoggedOut() {

    document
        .getElementById("loginButton")
        .style.display = "block";

    document
        .getElementById("userArea")
        .style.display = "none";

    document
        .getElementById("commentBox")
        .style.display = "none";

    document
        .getElementById("loginMessage")
        .style.display = "block";
}


function clearLogin() {

    sessionToken = null;
    currentUser = null;

    try {
        localStorage.removeItem(
            TOKEN_KEY
        );
    } catch {}

    showLoggedOut();
}


/* -----------------------------
   LOAD COMMENTS
----------------------------- */

async function loadComments() {

    if (!postId) {

        document
            .getElementById("comments")
            .innerHTML =
            '<div class="empty">No post ID provided.</div>';

        return;
    }

    try {

        const data =
            await api(
                "/?id=" +
                encodeURIComponent(postId)
            );

        renderComments(
            data.discussion
                ?.comments
                ?.nodes ||
            []
        );

    } catch (error) {

        console.error(error);

        document
            .getElementById("comments")
            .innerHTML =
            '<div class="empty">Unable to load comments.</div>';
    }
}


/* -----------------------------
   RENDER COMMENTS
----------------------------- */

function renderComments(comments) {

    const container =
        document.getElementById(
            "comments"
        );

    if (!comments.length) {

        container.innerHTML =
            '<div class="empty">No comments yet. Be the first!</div>';

        return;
    }

    container.innerHTML = "";

    const topLevel =
        comments.filter(
            comment =>
                !comment.replyTo
        );

    const replies =
        comments.filter(
            comment =>
                comment.replyTo
        );


    topLevel.forEach(comment => {

        container.appendChild(
            createComment(
                comment
            )
        );


        replies
            .filter(
                reply =>
                    reply.replyTo?.id ===
                    comment.id
            )
            .forEach(reply => {

                container.appendChild(
                    createComment(
                        reply,
                        true
                    )
                );

            });

    });
}


/* -----------------------------
   CREATE COMMENT
----------------------------- */

function createComment(
    comment,
    isReply = false
) {

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "comment" +
        (
            isReply
                ? " reply"
                : ""
        );


    const inner =
        document.createElement(
            "div"
        );

    inner.className =
        "comment-inner";


    /* AVATAR */

    const avatar =
        document.createElement(
            "img"
        );

    avatar.className =
        "comment-avatar";

    avatar.src =
        comment.author?.avatarUrl ||
        comment.author?.avatar_url ||
        "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png";

    avatar.alt = "";


    /* MAIN */

    const main =
        document.createElement(
            "div"
        );

    main.className =
        "comment-main";


    /* CARD */

    const card =
        document.createElement(
            "div"
        );

    card.className =
        "comment-card";


    /* AUTHOR */

    const author =
        document.createElement(
            "div"
        );

    author.className =
        "comment-author";

    author.textContent =
        comment.author?.login ||
        comment.author?.name ||
        "GitHub user";


    /* BODY */

    const text =
        document.createElement(
            "div"
        );

    text.className =
        "comment-text";

    text.textContent =
        comment.body ||
        "";


    card.appendChild(
        author
    );

    card.appendChild(
        text
    );


    /* DELETE MENU */

    const authorLogin =
        comment.author?.login ||
        "";

    const currentLogin =
        currentUser?.login ||
        "";

    /*
     * We display the menu only when
     * the visible GitHub author matches
     * the logged-in user.
     *
     * The Worker still performs the
     * actual security check.
     */

    if (
        currentLogin &&
        authorLogin &&
        currentLogin === authorLogin
    ) {

        const menu =
            document.createElement(
                "div"
            );

        menu.className =
            "comment-menu";


        const menuButton =
            document.createElement(
                "button"
            );

        menuButton.className =
            "menu-button";

        menuButton.textContent =
            "⋯";

        menuButton.setAttribute(
            "aria-label",
            "Comment options"
        );


        const dropdown =
            document.createElement(
                "div"
            );

        dropdown.className =
            "menu-dropdown";


        const deleteButton =
            document.createElement(
                "button"
            );

        deleteButton.className =
            "delete-button";

        deleteButton.textContent =
            "Delete comment";


        deleteButton.onclick =
            async () => {

                dropdown.style.display =
                    "none";

                await deleteComment(
                    comment.id
                );
            };


        menuButton.onclick =
            event => {

                event.stopPropagation();

                const open =
                    dropdown.style.display ===
                    "block";

                closeMenus();

                dropdown.style.display =
                    open
                        ? "none"
                        : "block";
            };


        dropdown.appendChild(
            deleteButton
        );

        menu.appendChild(
            menuButton
        );

        menu.appendChild(
            dropdown
        );

        card.appendChild(
            menu
        );
    }


    main.appendChild(
        card
    );


    /* DATE */

    const date =
        document.createElement(
            "div"
        );

    date.className =
        "comment-date";

    date.textContent =
        formatDate(
            comment.createdAt
        );

    main.appendChild(
        date
    );


    inner.appendChild(
        avatar
    );

    inner.appendChild(
        main
    );

    wrapper.appendChild(
        inner
    );


    return wrapper;
}


/* -----------------------------
   CLOSE MENUS
----------------------------- */

function closeMenus() {

    document
        .querySelectorAll(
            ".menu-dropdown"
        )
        .forEach(menu => {

            menu.style.display =
                "none";
        });
}


document.addEventListener(
    "click",
    closeMenus
);


/* -----------------------------
   DELETE COMMENT
----------------------------- */

async function deleteComment(
    commentId
) {

    if (!commentId) {
        return;
    }


    const confirmed =
        confirm(
            "Delete this comment?"
        );

    if (!confirmed) {
        return;
    }


    setStatus(
        "Deleting..."
    );


    try {

        await api(
            "/api/comment/delete",
            {
                method: "POST",

                body: JSON.stringify({
                    commentId
                })
            }
        );


        setStatus(
            "Comment deleted."
        );


        await loadComments();

    } catch (error) {

        console.error(
            error
        );

        setStatus(
            error.message ||
            "Could not delete comment."
        );
    }
}


/* -----------------------------
   POST COMMENT
----------------------------- */

async function postComment() {

    if (!sessionToken) {

        login();

        return;
    }


    const input =
        document.getElementById(
            "commentInput"
        );

    const button =
        document.getElementById(
            "postButton"
        );


    const body =
        input.value.trim();


    if (!body) {
        return;
    }


    button.disabled = true;

    setStatus(
        "Posting..."
    );


    try {

        await api(
            "/api/comment?id=" +
            encodeURIComponent(
                postId
            ),
            {
                method: "POST",

                body: JSON.stringify({
                    body
                })
            }
        );


        input.value = "";

        setStatus(
            "Comment posted."
        );


        await loadComments();

    } catch (error) {

        console.error(
            error
        );


        if (
            error.message
                .toLowerCase()
                .includes("auth")
        ) {

            clearLogin();

            setStatus(
                "Your login expired. Please sign in again."
            );

        } else {

            setStatus(
                error.message ||
                "Could not post comment."
            );
        }

    } finally {

        button.disabled = false;
    }
}


/* -----------------------------
   DATE
----------------------------- */

function formatDate(date) {

    if (!date) {
        return "";
    }

    const d =
        new Date(date);

    if (
        Number.isNaN(
            d.getTime()
        )
    ) {
        return "";
    }

    return d.toLocaleString();
}


/* -----------------------------
   STATUS
----------------------------- */

function setStatus(message) {

    document
        .getElementById("status")
        .textContent =
        message;


    if (message) {

        setTimeout(
            () => {

                const status =
                    document
                        .getElementById(
                            "status"
                        );

                if (
                    status.textContent ===
                    message
                ) {
                    status.textContent =
                        "";
                }

            },
            4000
        );
    }
}


/* -----------------------------
   START
----------------------------- */

(async function init() {

    sessionToken =
        getToken();

    await loadUser();

    await loadComments();

})();

</script>

</body>
</html>
