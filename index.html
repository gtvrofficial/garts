<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTVR — Home</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f1f1;color:#111;font:15px Arial,Helvetica,sans-serif}
nav{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #ddd;padding:14px max(18px,calc((100% - 900px)/2));font-size:22px;font-weight:600}
.feed{width:min(100%,680px);margin:20px auto}.post{background:#fff;border-radius:14px;margin-bottom:18px;overflow:hidden;box-shadow:0 2px 10px #00000012}
.user{display:flex;align-items:center;gap:12px;padding:14px}.user img{width:44px;height:44px;border-radius:50%;object-fit:cover}.user b{display:block}.user small{color:#777}
.art{width:100%;display:block;max-height:800px;object-fit:contain;background:#eee;cursor:zoom-in}.body{padding:14px}.star{border:0;background:none;font-size:18px;cursor:pointer;padding:4px}.count{color:#666}
.viewer{display:none;position:fixed;inset:0;background:#000d;z-index:100;align-items:center;justify-content:center;padding:20px}.viewer.open{display:flex}.viewer img{max-width:95vw;max-height:92vh;object-fit:contain}.close{position:fixed;right:20px;top:15px;color:#fff;font-size:34px;cursor:pointer}
@media(max-width:700px){.feed{margin:10px auto}.post{border-radius:0}.art{max-height:75vh}}
</style>
</head>
<body>
<nav>Home</nav><main class="feed" id="feed"></main>
<div class="viewer" id="viewer"><span class="close" onclick="closeViewer()">×</span><img id="viewerImg"></div>
<script>
const SITE = location.origin + location.pathname.replace(/\/?$/,"/");
function asset(path){return path.startsWith("http")?path:SITE+path.replace(/^\/+/,"")}
function starKey(id){return "star:"+id}
function openViewer(src){viewer.classList.add("open");viewerImg.src=src}
function closeViewer(){viewer.classList.remove("open");viewerImg.src=""}
async function main(){
 const r=await fetch(SITE+"data/feed.json?"+Date.now()); const data=await r.json();
 feed.innerHTML=data.posts.map(p=>`
 <article class="post">
  <div class="user"><img src="${asset(p.avatar)}"><div><b>${escapeHtml(p.display_name)}</b><small>@${escapeHtml(p.username)}</small></div></div>
  <img class="art" src="${asset(p.image)}" onclick="openViewer(this.src)" alt="Artwork">
  <div class="body"><button class="star" onclick="toggleStar(${p.post_id})">★</button><span class="count" id="count-${p.post_id}">Star this post</span>${p.caption?`<p>${escapeHtml(p.caption)}</p>`:""}</div>
 </article>`).join("");
}
function toggleStar(id){const key=starKey(id);const on=localStorage.getItem(key)==="1";localStorage.setItem(key,on?"0":"1");document.getElementById("count-"+id).textContent=on?"Star this post":"Starred on this device";}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
main().catch(()=>feed.innerHTML="<p>Unable to load the feed.</p>");
</script>
</body></html>
