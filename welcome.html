<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>GARTS</title>

<style>

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;

    background: transparent;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    overflow: hidden;
}

#root {
    width: 100%;
}

.welcome {
    display: flex;
    flex-direction: column;

    gap: 7px;

    width: fit-content;
    max-width: 100%;
}

.welcome-title {
    font-size: 17px;
    font-weight: 700;

    line-height: 1.2;
}

.account {
    display: flex;
    align-items: center;

    width: fit-content;
    max-width: 100%;
}

.profile-link {
    display: flex;
    align-items: center;

    gap: 9px;

    color: inherit;
    text-decoration: none;
}

.avatar {
    width: 36px;
    height: 36px;

    border-radius: 50%;

    object-fit: cover;

    flex-shrink: 0;

    background: #e5e5e5;
}

.name-area {
    display: flex;
    flex-direction: column;

    line-height: 1.15;

    min-width: 0;
}

.display-name {
    font-size: 14px;
    font-weight: 600;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.username {
    margin-top: 2px;

    font-size: 12px;

    opacity: .65;

    white-space: nowrap;
}

.login {
    width: fit-content;

    border: 0;
    border-radius: 8px;

    padding: 8px 13px;

    font-family: inherit;
    font-size: 13px;
    font-weight: 500;

    cursor: pointer;

    background: #24292f;
    color: white;
}

.login:disabled {
    opacity: .6;
}

@media (max-width: 500px) {

    .welcome-title {
        font-size: 16px;
    }

    .avatar {
        width: 34px;
        height: 34px;
    }

    .display-name {
        font-size: 13px;
    }

    .username {
        font-size: 11px;
    }

    .login {
        padding: 7px 11px;
        font-size: 12px;
    }

}

</style>

</head>

<body>

<div id="root"></div>

<script>

"use strict";


const WORKER =
    "https://garts-comments.w8361346.workers.dev";

const TOKEN_KEY =
    "garts_session_token";

const root =
    document.getElementById("root");


function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


function profileUrl(username) {

    return (
        "https://gtvrofficial.github.io/garts/users/" +
        encodeURIComponent(username)
    );

}


function showLoggedOut() {

    root.innerHTML = `

        <div class="welcome">

            <div class="welcome-title">
                Welcome Back, GTVR
            </div>

            <button
                class="login"
                id="loginButton"
                type="button"
            >
                Sign in with GitHub
            </button>

        </div>

    `;


    document
        .getElementById("loginButton")
        .addEventListener(
            "click",
            login
        );

}


function showAccount(user) {

    const username =
        user.gartsUsername ||
        user.login ||
        user.username ||
        "";


    const displayName =
        user.displayName ||
        user.name ||
        user.login ||
        "GARTS User";


    const avatar =
        user.avatarUrl ||
        user.avatar_url ||
        "";


    root.innerHTML = `

        <div class="welcome">

            <div class="welcome-title">
                Welcome Back, ${escapeHtml(displayName)}
            </div>

            <div class="account">

                <a
                    class="profile-link"
                    href="${profileUrl(username)}"
                    target="_top"
                >

                    <img
                        class="avatar"
                        src="${escapeHtml(avatar)}"
                        alt=""
                    >

                    <div class="name-area">

                        <div class="display-name">
                            ${escapeHtml(displayName)}
                        </div>

                        <div class="username">
                            @${escapeHtml(username)}
                        </div>

                    </div>

                </a>

            </div>

        </div>

    `;

}


function getToken() {

    try {

        return localStorage.getItem(
            TOKEN_KEY
        );

    } catch {

        return null;

    }

}


function saveToken(token) {

    if (!token) {
        return;
    }

    try {

        localStorage.setItem(
            TOKEN_KEY,
            token
        );

    } catch (error) {

        console.error(
            "Could not save GARTS session:",
            error
        );

    }

}


function removeToken() {

    try {

        localStorage.removeItem(
            TOKEN_KEY
        );

    } catch {}

}


async function getMe() {

    const token =
        getToken();


    const headers = {
        "Accept":
            "application/json"
    };


    if (token) {

        headers["Authorization"] =
            "Bearer " + token;

    }


    try {

        const response =
            await fetch(
                WORKER + "/api/me",
                {
                    method:
                        "GET",

                    headers:
                        headers,

                    credentials:
                        "include"
                }
            );


        if (!response.ok) {

            if (
                response.status === 401 ||
                response.status === 403
            ) {

                removeToken();

            }

            return false;

        }


        const data =
            await response.json();


        if (
            data.success &&
            data.user
        ) {

            showAccount(
                data.user
            );

            return true;

        }

    } catch (error) {

        console.error(
            "GARTS /api/me failed:",
            error
        );

    }


    return false;

}


function login() {

    const width = 600;
    const height = 700;

    const left =
        window.screenX +
        (
            window.outerWidth -
            width
        ) / 2;

    const top =
        window.screenY +
        (
            window.outerHeight -
            height
        ) / 2;


    const popup =
        window.open(
            WORKER +
            "/oauth/login?return=welcome",

            "gartsOAuth",

            `width=${width},height=${height},left=${left},top=${top},popup=yes`
        );


    if (!popup) {

        window.location.href =
            WORKER +
            "/oauth/login?return=welcome";

        return;

    }


    popup.focus();

}


window.addEventListener(
    "message",
    async function(event) {

        if (
            event.origin !== WORKER
        ) {

            return;

        }


        const data =
            event.data;


        if (
            !data ||
            data.type !== "garts-auth"
        ) {

            return;

        }


        console.log(
            "GARTS OAuth session received."
        );


        if (data.token) {

            saveToken(
                data.token
            );

        }


        if (data.user) {

            showAccount(
                data.user
            );

        }


        await getMe();

    }
);


async function init() {

    const authenticated =
        await getMe();


    if (!authenticated) {

        showLoggedOut();

    }

}


init();

</script>

</body>

</html>
