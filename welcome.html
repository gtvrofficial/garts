<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  font-family: Arial, Helvetica, sans-serif;
}

.welcome {
  width: 100%;
  height: 82px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
}

.content {
  width: 100%;
}

.title {
  font-size: clamp(18px, 2.5vw, 25px);
  font-weight: 700;
  line-height: 1.1;
  margin-bottom: 7px;
  color: #111;
}

.account {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  text-decoration: none;
  color: inherit;
  max-width: 100%;
  border-radius: 10px;
  padding: 2px 5px 2px 2px;
}

.account:hover {
  background: #eeeeee;
}

.avatar {
  width: 34px;
  height: 34px;
  min-width: 34px;
  border-radius: 50%;
  object-fit: cover;
  display: block;
  background: #ddd;
}

.account-info {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 7px;
}

.display-name {
  font-size: 15px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 45vw;
}

.username {
  font-size: 13px;
  color: #65676b;
  white-space: nowrap;
}

.signin {
  border: 0;
  border-radius: 9px;
  padding: 7px 13px;
  background: #111;
  color: white;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

.signin:hover {
  opacity: .85;
}

.loading {
  font-size: 13px;
  color: #777;
}

/* Mobile */
@media (max-width: 600px) {

  .welcome {
    height: 78px;
    padding: 9px 10px;
  }

  .title {
    font-size: 19px;
    margin-bottom: 6px;
  }

  .avatar {
    width: 31px;
    height: 31px;
    min-width: 31px;
  }

  .display-name {
    font-size: 14px;
    max-width: 42vw;
  }

  .username {
    font-size: 12px;
  }

  .account-info {
    gap: 5px;
  }
}
</style>
</head>

<body>

<div class="welcome">

  <div class="content">

    <div class="title">
      Welcome Back, <span id="welcomeName">there</span>
    </div>

    <div id="accountArea">
      <div class="loading">Loading...</div>
    </div>

  </div>

</div>

<script>

const WORKER =
  "https://garts-comments.w8361346.workers.dev";

const welcomeName =
  document.getElementById("welcomeName");

const accountArea =
  document.getElementById("accountArea");


function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function openLogin() {

  const width = 500;
  const height = 650;

  const left =
    window.screenX +
    (window.outerWidth - width) / 2;

  const top =
    window.screenY +
    (window.outerHeight - height) / 2;

  window.open(
    WORKER + "/oauth/login?return=welcome",
    "gartsLogin",
    `width=${width},height=${height},left=${left},top=${top}`
  );

}


async function loadAccount() {

  try {

    const response =
      await fetch(WORKER + "/api/me", {
        credentials: "include"
      });

    const data =
      await response.json();

    if (!data.success || !data.user) {

      showLoggedOut();
      return;

    }

    showAccount(data.user);

  } catch (error) {

    console.error(error);
    showLoggedOut();

  }

}


function showAccount(user) {

  const username =
    user.gartsUsername ||
    user.login ||
    "user";

  const displayName =
    user.name ||
    user.login ||
    username;

  const avatar =
    user.avatarUrl ||
    "https://github.com/identicons/" +
    encodeURIComponent(username) +
    ".png";

  welcomeName.textContent =
    displayName;

  accountArea.innerHTML = `

    <a
      class="account"
      href="/users/${encodeURIComponent(username)}"
      title="Open profile"
    >

      <img
        class="avatar"
        src="${escapeHTML(avatar)}"
        alt=""
      >

      <div class="account-info">

        <div class="display-name">
          ${escapeHTML(displayName)}
        </div>

        <div class="username">
          @${escapeHTML(username)}
        </div>

      </div>

    </a>

  `;

}


function showLoggedOut() {

  welcomeName.textContent =
    "there";

  accountArea.innerHTML = `

    <button
      class="signin"
      onclick="openLogin()"
    >
      Sign in with GitHub
    </button>

  `;

}


window.addEventListener("message", event => {

  if (!event.data)
    return;

  if (event.data.type !== "garts-auth")
    return;

  loadAccount();

});


loadAccount();

</script>

</body>
</html>
