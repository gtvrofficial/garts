```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GARTS Welcome</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Roboto,
            Arial,
            sans-serif;
        background: transparent;
        color: #111;
    }

    .welcome {
        width: 100%;
        max-width: 720px;
        margin: 0 auto;
        padding: 14px 16px;

        display: flex;
        align-items: center;
        gap: 13px;
    }

    .avatar-link {
        flex-shrink: 0;
        text-decoration: none;
    }

    .avatar {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        object-fit: cover;
        display: block;
        background: #e9e9e9;
        border: 1px solid rgba(0, 0, 0, 0.08);
    }

    .text {
        min-width: 0;
        flex: 1;
    }

    .welcome-text {
        font-size: 16px;
        font-weight: 700;
        line-height: 1.25;
        margin-bottom: 3px;
    }

    .account {
        display: flex;
        align-items: center;
        gap: 5px;
        min-width: 0;
    }

    .display-name {
        font-size: 14px;
        font-weight: 600;
        color: #333;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .username {
        font-size: 13px;
        color: #777;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .login-button {
        flex-shrink: 0;

        border: 0;
        border-radius: 9px;
        padding: 10px 15px;

        background: #111;

        font-weight: 600;

        transition:
            transform 0.12s ease,

    }

    .login-button:hover {
        opacity: 0.9;
    }

    .login-button:active {
        transform: scale(0.97);
    }

        .welcome {
            padding: 12px;

        .avatar {
            width: 46px;

</style>
</head>

<body>

<div class="welcome">

    <!-- Avatar -->
    <a
        id="avatarLink"
        class="avatar-link hidden"
        href="#"
        target="_top"
    >
        <img

        >
    </a>

    <!-- Text -->
    <div class="text">

        <div
            id="welcomeText"

            Welcome Back, GTVR

            id="account"
            class="account hidden"
        >
            <span

            Not signed in

    <!-- Login -->
    <button

        class="login-button"
        type="button"
    >
        Sign in with GitHub
    </button>

</div>

<script>
/* =========================================================
   CONFIG
========================================================= */

const WORKER =
    "https://garts-comments.w8361346.workers.dev";

const TOKEN_KEY =
    "garts_session_token";

const PROFILE_BASE =
    "https://gtvrofficial.github.io/garts/users/";


/* =========================================================
   ELEMENTS
========================================================= */

const welcomeText =
    document.getElementById("welcomeText");

const account =
    document.getElementById("account");

const displayName =
    document.getElementById("displayName");

const username =
    document.getElementById("username");

const status =
    document.getElementById("status");

const avatar =
    document.getElementById("avatar");

const avatarLink =
    document.getElementById("avatarLink");

const loginButton =
    document.getElementById("loginButton");


/* =========================================================
   HELPERS
========================================================= */

function getToken() {
    return localStorage.getItem(TOKEN_KEY);
}

function setToken(token) {
    if (!token) return;

    localStorage.setItem(
        TOKEN_KEY,
        token
    );
}

function clearToken() {
    localStorage.removeItem(
        TOKEN_KEY
    );
}

function profileUrl(username) {
    return (
        PROFILE_BASE +
        encodeURIComponent(username)
    );
}


/* =========================================================
   LOGGED OUT UI
========================================================= */

function showLoggedOut() {

    welcomeText.textContent =
        "Welcome Back, GTVR";

    account.classList.add(
        "hidden"
    );

    avatarLink.classList.add(
        "hidden"
    );

    avatar.removeAttribute("src");

    status.textContent =
        "Not signed in";

    loginButton.classList.remove(
        "hidden"
    );

    loginButton.disabled = false;

    loginButton.textContent =
        "Sign in with GitHub";
}


/* =========================================================
   LOGGED IN UI
========================================================= */

function showLoggedIn(user) {

    const name =
        user?.name ||
        user?.login ||
        "GTVR";

    const login =
        user?.login ||
        "";

    welcomeText.textContent =
        `Welcome Back, ${name}`;

    displayName.textContent =
        name;

    username.textContent =
        login
            ? `@${login}`
            : "";

    account.classList.remove(
        "hidden"
    );

    if (user?.avatar_url) {

        avatar.src =
            user.avatar_url;

        avatarLink.href =
            profileUrl(login);

        avatarLink.classList.remove(
            "hidden"
        );
    }

    status.textContent =
        "Signed in with GitHub";

    loginButton.classList.add(
        "hidden"
    );
}


/* =========================================================
   CHECK SESSION
========================================================= */

async function checkSession() {

    const token =
        getToken();

    if (!token) {
        showLoggedOut();
        return;
    }

    status.textContent =
        "Checking account...";

    try {

        const response =
            await fetch(
                `${WORKER}/api/me`,
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    },

                    cache: "no-store"
                }
            );

        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}`
            );
        }

        const data =
            await response.json();

        if (
            data &&
            data.loggedIn &&
            data.user
        ) {

            showLoggedIn(
                data.user
            );

            return;
        }

        /*
         * The token exists locally but
         * Cloudflare no longer recognizes it.
         */

        clearToken();

        showLoggedOut();

    } catch (error) {

        console.error(
            "GARTS session check failed:",
            error
        );

        /*
         * Don't immediately delete the token
         * just because the network failed.
         *
         * It may simply be a temporary
         * connection problem.
         */

        status.textContent =
            "Unable to check login";

        loginButton.classList.remove(
            "hidden"
        );
    }
}


/* =========================================================
   LOGIN
========================================================= */

loginButton.addEventListener(
    "click",
    () => {

        /*
         * The Worker remembers the post ID
         * if one was supplied.
         */

        const currentUrl =
            new URL(
                window.location.href
            );

        const postId =
            currentUrl.searchParams.get(
                "id"
            );

        let loginUrl =
            `${WORKER}/oauth/login`;

        if (postId) {

            loginUrl +=
                `?id=${encodeURIComponent(
                    postId
                )}`;
        }

        /*
         * Open GitHub authentication in a popup.
         */

        const width = 520;
        const height = 720;

        const left =
            Math.max(
                0,
                (screen.width - width) / 2
            );

        const top =
            Math.max(
                0,
                (screen.height - height) / 2
            );

        const popup =
            window.open(
                loginUrl,
                "garts_github_login",
                [
                    `width=${width}`,
                    `height=${height}`,
                    `left=${left}`,
                    `top=${top}`,
                    "popup=yes",
                    "resizable=yes",
                    "scrollbars=yes"
                ].join(",")
            );

        /*
         * Some browsers may block popups.
         */

        if (!popup) {

            window.open(
                loginUrl,
                "_blank"
            );
        }
    }
);


/* =========================================================
   OAUTH MESSAGE
========================================================= */

window.addEventListener(
    "message",
    async event => {

        /*
         * IMPORTANT:
         *
         * Only accept messages originating from
         * our Cloudflare Worker.
         */

        if (
            event.origin !== WORKER
        ) {
            return;
        }

        const data =
            event.data;

        if (
            !data ||
            data.type !== "garts-auth"
        ) {
            return;
        }

        /*
         * Login failed.
         */

        if (!data.token) {

            console.error(
                "GARTS OAuth failed:",
                data
            );

            status.textContent =
                "Login failed";

            return;
        }

        /*
         * Save the GARTS session.
         */

        setToken(
            data.token
        );

        /*
         * Immediately display the
         * account information returned
         * by OAuth.
         */

        if (data.user) {

            showLoggedIn(
                data.user
            );
        }

        /*
         * Then verify the session against
         * Cloudflare.
         */

        await checkSession();
    }
);


/* =========================================================
   STARTUP
========================================================= */

showLoggedOut();

checkSession();

</script>

</body>
</html>
