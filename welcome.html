<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  background: transparent !important;
  overflow: hidden !important;
  font-family: Arial, Helvetica, sans-serif;
}

.welcome {
  width: 100%;
  padding: 8px 12px;
}

.title {
  margin: 0 0 6px;
  font-size: clamp(18px, 3vw, 24px);
  line-height: 1.15;
  font-weight: 700;
  color: #111;
}

.account {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  max-width: 100%;
  padding: 2px 6px 2px 2px;
  border-radius: 10px;
  color: inherit;
  text-decoration: none;
}

.account:hover {
  background: rgba(0,0,0,.06);
}

.avatar {
  width: 36px;
  height: 36px;
  min-width: 36px;
  min-height: 36px;
  border-radius: 50%;
  object-fit: cover;
  display: block;
  background: #ddd;
}

.account-info {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
}

.display-name {
  font-size: 15px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 45vw;
}

.username {
  font-size: 13px;
  color: #65676b;
  white-space: nowrap;
}

.signin {
  appearance: none;
  border: 0;
  padding: 7px 13px;
  border-radius: 9px;
  background: #111;
  color: white;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

.signin:hover {
  opacity: .85;
}

.loading {
  font-size: 13px;
  color: #777;
}

@media (max-width: 600px) {

  .welcome {
    padding: 7px 9px;
  }

  .title {
    font-size: 19px;
    margin-bottom: 5px;
  }

  .avatar {
    width: 32px;
    height: 32px;
    min-width: 32px;
    min-height: 32px;
  }

  .display-name {
    font-size: 14px;
    max-width: 42vw;
  }

  .username {
    font-size: 12px;
  }

  .account-info {
    gap: 5px;
  }
}
</style>
</head>

<body>

<div class="welcome">

  <div class="title">
    Welcome Back, <span id="welcomeName">there</span>
  </div>

  <div id="accountArea">
    <div class="loading">
      Loading...
    </div>
  </div>

</div>

<script>

const WORKER =
  "https://garts-comments.w8361346.workers.dev";

const welcomeName =
  document.getElementById("welcomeName");

const accountArea =
  document.getElementById("accountArea");


/* -----------------------------------------
   HTML escaping
----------------------------------------- */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* -----------------------------------------
   GitHub authentication
----------------------------------------- */

function authenticate() {

  const width = 500;
  const height = 650;

  const left =
    window.screenX +
    (window.outerWidth - width) / 2;

  const top =
    window.screenY +
    (window.outerHeight - height) / 2;


  window.open(

    WORKER +
    "/oauth/login?return=welcome",

    "gartsLogin",

    `width=${width},height=${height},left=${left},top=${top}`

  );

}


/* -----------------------------------------
   Get current GARTS account
----------------------------------------- */

async function loadAccount() {

  try {

    const response =
      await fetch(
        WORKER + "/api/me",
        {
          method: "GET",
          credentials: "include",
          cache: "no-store"
        }
      );


    const data =
      await response.json();


    if (
      !data.success ||
      !data.user
    ) {

      showLoggedOut();
      return;

    }


    showAccount(data.user);


  } catch (error) {

    console.error(
      "GARTS account error:",
      error
    );

    showLoggedOut();

  }

}


/* -----------------------------------------
   Show logged-in account
----------------------------------------- */

function showAccount(user) {

  const username =
    user.gartsUsername ||
    user.login ||
    "user";


  const displayName =
    user.name ||
    user.login ||
    username;


  const avatar =
    user.avatarUrl ||
    (
      "https://github.com/identicons/" +
      encodeURIComponent(username) +
      ".png"
    );


  welcomeName.textContent =
    displayName;


  accountArea.innerHTML = `

    <a
      class="account"
      href="https://gtvrofficial.github.io/garts/users/${encodeURIComponent(username)}"
      title="Open profile"
    >

      <img
        class="avatar"
        src="${escapeHTML(avatar)}"
        alt=""
      >

      <div class="account-info">

        <span class="display-name">
          ${escapeHTML(displayName)}
        </span>

        <span class="username">
          @${escapeHTML(username)}
        </span>

      </div>

    </a>

  `;

}


/* -----------------------------------------
   Logged out state
----------------------------------------- */

function showLoggedOut() {

  welcomeName.textContent =
    "there";


  accountArea.innerHTML = `

    <button
      class="signin"
      id="signinButton"
      type="button"
    >
      Sign in with GitHub
    </button>

  `;


  document
    .getElementById("signinButton")
    .addEventListener(
      "click",
      authenticate
    );

}


/* -----------------------------------------
   OAuth finished
----------------------------------------- */

window.addEventListener(
  "message",
  function(event) {

    if (!event.data)
      return;


    if (
      event.data.type !==
      "garts-auth"
    )
      return;


    /*
      OAuth succeeded.

      Ask the Worker for the SAME
      GARTS account used by comments.
    */

    loadAccount();

  }
);


/* -----------------------------------------
   Initial load
----------------------------------------- */

loadAccount();

</script>

</body>
</html>
