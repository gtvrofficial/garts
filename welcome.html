<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>GARTS Account</title>

<style>

    html,
    body {
        margin: 0;
        padding: 0;

        width: 100%;

        background: transparent;

        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Roboto,
            Helvetica,
            Arial,
            sans-serif;

        overflow: hidden;
    }


    /* =========================
       MAIN ACCOUNT
       ========================= */

    #root {
        width: 100%;
    }


    .account {
        display: flex;

        align-items: center;

        width: fit-content;
        max-width: 100%;

        min-height: 38px;
    }


    /* =========================
       PROFILE LINK
       ========================= */

    .profile-link {
        display: flex;

        align-items: center;

        gap: 9px;

        text-decoration: none;

        color: inherit;

        max-width: 100%;
    }


    /* =========================
       AVATAR
       ========================= */

    .avatar {
        width: 38px;
        height: 38px;

        border-radius: 50%;

        object-fit: cover;

        flex-shrink: 0;

        display: block;

        background: #e5e5e5;
    }


    /* =========================
       TEXT
       ========================= */

    .name-area {
        display: flex;

        flex-direction: column;

        justify-content: center;

        min-width: 0;

        line-height: 1.15;
    }


    .display-name {
        font-size: 14px;

        font-weight: 600;

        white-space: nowrap;

        overflow: hidden;

        text-overflow: ellipsis;
    }


    .username {
        margin-top: 2px;

        font-size: 12px;

        opacity: 0.65;

        white-space: nowrap;

        overflow: hidden;

        text-overflow: ellipsis;
    }


    /* =========================
       LOGIN BUTTON
       ========================= */

    .login {
        border: 0;

        border-radius: 8px;

        padding: 8px 13px;

        font-family: inherit;

        font-size: 13px;

        font-weight: 500;

        cursor: pointer;

        background: #24292f;

        color: white;

        transition:
            opacity 0.15s ease,
            transform 0.1s ease;
    }


    .login:hover {
        opacity: 0.9;
    }


    .login:active {
        transform: scale(0.97);
    }


    .login:disabled {
        opacity: 0.6;

        cursor: default;

        transform: none;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 500px) {

        .avatar {
            width: 34px;
            height: 34px;
        }


        .profile-link {
            gap: 8px;
        }


        .display-name {
            font-size: 13px;
        }


        .username {
            font-size: 11px;
        }


        .login {
            padding: 7px 11px;

            font-size: 12px;

            border-radius: 7px;
        }
    }

</style>

</head>


<body>

<div id="root"></div>


<script>

"use strict";


/* =========================================================
   CONFIGURATION
   ========================================================= */

const WORKER =
    "https://garts-comments.w8361346.workers.dev";


/*
 * This is the SAME key that comments.html should use.
 *
 * It contains the GARTS session ID.
 *
 * It does NOT contain the GitHub OAuth access token.
 */

const TOKEN_KEY =
    "garts_session_token";


const root =
    document.getElementById("root");


/* =========================================================
   PROFILE URL
   ========================================================= */

function profileUrl(username) {

    return (
        "https://gtvrofficial.github.io/garts/users/" +
        encodeURIComponent(username)
    );

}


/* =========================================================
   HTML ESCAPING
   ========================================================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =========================================================
   SHOW LOGGED OUT
   ========================================================= */

function showLoggedOut() {

    root.innerHTML = `
        <button
            class="login"
            id="loginButton"
            type="button"
        >
            Sign in with GitHub
        </button>
    `;


    const button =
        document.getElementById("loginButton");


    if (button) {

        button.addEventListener(
            "click",
            login
        );

    }

}


/* =========================================================
   SHOW LOGGED IN
   ========================================================= */

function showAccount(user) {

    if (!user) {

        showLoggedOut();

        return;

    }


    /*
     * Support all of the user field names
     * used by the current/future API.
     */

    const username =
        user.gartsUsername ||
        user.login ||
        user.username ||
        "";


    const displayName =
        user.displayName ||
        user.name ||
        user.login ||
        "GARTS User";


    const avatar =
        user.avatarUrl ||
        user.avatar_url ||
        "";


    /*
     * Don't attempt to make a profile URL
     * if the account has no username.
     */

    if (!username) {

        root.innerHTML = `
            <div class="account">

                <div class="name-area">

                    <div class="display-name">
                        ${escapeHtml(displayName)}
                    </div>

                </div>

            </div>
        `;

        return;

    }


    root.innerHTML = `
        <div class="account">

            <a
                class="profile-link"
                href="${profileUrl(username)}"
                target="_top"
                aria-label="Open ${escapeHtml(displayName)} profile"
            >

                <img
                    class="avatar"
                    src="${escapeHtml(avatar)}"
                    alt=""
                    loading="lazy"
                >

                <div class="name-area">

                    <div class="display-name">
                        ${escapeHtml(displayName)}
                    </div>

                    <div class="username">
                        @${escapeHtml(username)}
                    </div>

                </div>

            </a>

        </div>
    `;

}


/* =========================================================
   GET STORED TOKEN
   ========================================================= */

function getToken() {

    try {

        return localStorage.getItem(
            TOKEN_KEY
        );

    } catch (error) {

        console.warn(
            "Unable to access localStorage:",
            error
        );

        return null;

    }

}


/* =========================================================
   SAVE TOKEN
   ========================================================= */

function saveToken(token) {

    if (!token) {
        return;
    }


    try {

        localStorage.setItem(
            TOKEN_KEY,
            token
        );

        console.log(
            "GARTS session token saved."
        );

    } catch (error) {

        console.error(
            "Unable to save GARTS session token:",
            error
        );

    }

}


/* =========================================================
   REMOVE TOKEN
   ========================================================= */

function removeToken() {

    try {

        localStorage.removeItem(
            TOKEN_KEY
        );

    } catch (error) {

        console.warn(
            "Unable to remove GARTS session token:",
            error
        );

    }

}


/* =========================================================
   GET CURRENT ACCOUNT
   ========================================================= */

async function getMe() {

    const token =
        getToken();


    const headers = {

        "Accept":
            "application/json"

    };


    /*
     * If we have a GARTS bearer session,
     * send it to the Worker.
     */

    if (token) {

        headers["Authorization"] =
            "Bearer " + token;

    }


    try {

        const response =
            await fetch(
                WORKER + "/api/me",
                {
                    method: "GET",

                    headers: headers,

                    /*
                     * Keep cookies enabled as a fallback
                     * for the old session implementation.
                     */

                    credentials: "include"
                }
            );


        if (!response.ok) {

            /*
             * A stored token that no longer exists
             * should be removed.
             */

            if (
                response.status === 401 ||
                response.status === 403
            ) {

                if (token) {
                    removeToken();
                }

            }

            throw new Error(
                "Authentication failed: " +
                response.status
            );

        }


        const data =
            await response.json();


        if (
            data &&
            data.success &&
            data.user
        ) {

            showAccount(
                data.user
            );

            return true;

        }


        throw new Error(
            "API did not return a valid account."
        );

    } catch (error) {

        console.log(
            "GARTS authentication check:",
            error
        );

        return false;

    }

}


/* =========================================================
   LOGIN WITH GITHUB
   ========================================================= */

function login() {

    const width =
        600;

    const height =
        700;


    /*
     * Center popup relative to the current window.
     */

    const left =
        window.screenX +
        (
            window.outerWidth -
            width
        ) / 2;


    const top =
        window.screenY +
        (
            window.outerHeight -
            height
        ) / 2;


    const loginUrl =
        WORKER +
        "/oauth/login?return=welcome";


    const popup =
        window.open(
            loginUrl,
            "gartsOAuth",
            [
                "width=" + width,
                "height=" + height,
                "left=" + left,
                "top=" + top,
                "popup=yes"
            ].join(",")
        );


    /*
     * Some browsers block popups if login()
     * wasn't triggered by a user click.
     */

    if (!popup) {

        /*
         * Fall back to navigating the current
         * window if the popup was blocked.
         */

        window.location.href =
            loginUrl;

        return;

    }


    popup.focus();

}


/* =========================================================
   OAUTH CALLBACK MESSAGE
   ========================================================= */

window.addEventListener(
    "message",
    async function(event) {

        /*
         * SECURITY:
         *
         * Only accept messages originating
         * from our Worker.
         */

        if (
            event.origin !== WORKER
        ) {

            return;

        }


        const data =
            event.data;


        /*
         * Ignore unrelated postMessage events.
         */

        if (
            !data ||
            data.type !== "garts-auth"
        ) {

            return;

        }


        console.log(
            "GARTS OAuth authentication received."
        );


        /*
         * The Worker should send:
         *
         * {
         *     type: "garts-auth",
         *     token: "GARTS_SESSION_ID",
         *     user: {...}
         * }
         *
         * The token is our opaque GARTS
         * session ID.
         */

        if (data.token) {

            saveToken(
                data.token
            );

        }


        /*
         * Immediately update the UI using
         * the user returned by OAuth.
         */

        if (data.user) {

            showAccount(
                data.user
            );

        }


        /*
         * Then verify the session against
         * the Worker.
         */

        const authenticated =
            await getMe();


        if (!authenticated) {

            /*
             * If the token wasn't accepted,
             * return to the logged-out state.
             */

            showLoggedOut();

        }

    }
);


/* =========================================================
   OPTIONAL: RECEIVE AUTH FROM PARENT
   ========================================================= */

window.addEventListener(
    "message",
    function(event) {

        /*
         * This allows another GARTS iframe/page
         * to pass the session along if needed.
         */

        if (
            event.origin !==
            "https://gtvrofficial.github.io"
        ) {

            return;

        }


        const data =
            event.data;


        if (
            !data ||
            data.type !== "garts-auth"
        ) {

            return;

        }


        if (data.token) {

            saveToken(
                data.token
            );

        }


        if (data.user) {

            showAccount(
                data.user
            );

        }

    }
);


/* =========================================================
   INITIALIZATION
   ========================================================= */

async function init() {

    /*
     * Start with the existing session.
     */

    const authenticated =
        await getMe();


    /*
     * Only show the login button if
     * there isn't a valid session.
     */

    if (!authenticated) {

        showLoggedOut();

    }

}


/* =========================================================
   START
   ========================================================= */

init();

</script>

</body>
</html>
